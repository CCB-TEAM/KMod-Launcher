[package]
name = "kmod-launcher"
version = "1.2.0"
edition = "2021"
description = "Installer and manager for the KMod loader"
license = "MIT"

[lib]
name = "kmod_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "kmod-launcher"
path = "src/main.rs"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "image-ico"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json", "gzip", "proxy-from-env"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
